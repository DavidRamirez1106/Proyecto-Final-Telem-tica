worker_processes auto;
events { worker_connections 1024; }

http {
    # ── Upstream: Round Robin (política por defecto en NGINX) ────────────────
    upstream webservers {
        server webserver1:5000;
        server webserver2:5000;
        # round-robin es la política implícita; cada petición va al siguiente
    }

    # ── Redirigir HTTP → HTTPS ────────────────────────────────────────────────
    server {
        listen 80;
        server_name eafitregistro.duckdns.org;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS principal ───────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name eafitregistro.duckdns.org;

        # Certificado SSL (Let's Encrypt o auto-firmado para pruebas)
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Cabeceras de seguridad
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;

        # ── Proxy reverso hacia los dos servidores web ─────────────────────
        location / {
            proxy_pass         http://webservers;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
        }
    }
}
