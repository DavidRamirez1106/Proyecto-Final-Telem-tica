version: "3.9"

services:

  # ── Balanceador de carga / Proxy reverso ──────────────────────────────────
  nginx:
    build: ./nginx
    container_name: nginx_lb
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - webserver1
      - webserver2
    networks:
      - frontend
    restart: unless-stopped

  # ── Servidor Web 1 (English) ──────────────────────────────────────────────
  webserver1:
    build: ./webserver1
    container_name: webserver1_en
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=registro
      - DB_USER=appuser
      - DB_PASSWORD=apppass123
      - LANG=en
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped

  # ── Servidor Web 2 (Español) ──────────────────────────────────────────────
  webserver2:
    build: ./webserver2
    container_name: webserver2_es
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=registro
      - DB_USER=appuser
      - DB_PASSWORD=apppass123
      - LANG=es
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped

  # ── Base de Datos PostgreSQL ──────────────────────────────────────────────
  db:
    build: ./db
    container_name: postgres_db
    environment:
      - POSTGRES_DB=registro
      - POSTGRES_USER=appuser
      - POSTGRES_PASSWORD=apppass123
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d registro"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── App de Estadísticas ───────────────────────────────────────────────────
  stats:
    build: ./stats
    container_name: stats_app
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=registro
      - DB_USER=appuser
      - DB_PASSWORD=apppass123
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=tucorreo@gmail.com
      - SMTP_PASS=tupassword
      - DEST_EMAIL=ialondonoo@eafit.edu.co
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

volumes:
  pgdata:

networks:
  frontend:
  backend:
    internal: true
